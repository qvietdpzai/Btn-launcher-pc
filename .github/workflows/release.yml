name: Build and Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag name
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_NAME: BTN-Launcher-Windows-MSVC-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure project
        run: cmake --preset "$CMAKE_PRESET"

      - name: Build
        run: cmake --build --preset "$CMAKE_PRESET" --config Release

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: Release
          artifact-name: Windows-MSVC
          azure-client-id: ""
          azure-tenant-id: ""
          azure-subscription-id: ""

  create_release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts -type f | head -30

      - name: Package release files
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir release

          for d in artifacts/BTN-Launcher-Windows-MSVC-Setup-*; do
            [ -d "$d" ] || continue
            cp "$d"/*.exe "release/BTN-Launcher-Windows-Setup-${VERSION}.exe" 2>/dev/null || true
          done

          for d in artifacts/BTN-Launcher-Windows-MSVC-Portable-*; do
            [ -d "$d" ] || continue
            cd "$d" && zip -r -9 "../../release/BTN-Launcher-Windows-Portable-${VERSION}.zip" * && cd ../..
          done

          for d in artifacts/BTN-Launcher-Windows-MSVC-${{ steps.version.outputs.version }}-*; do
            [ -d "$d" ] || continue
            [[ "$d" == *Setup* || "$d" == *Portable* ]] && continue
            cd "$d" && zip -r -9 "../../release/BTN-Launcher-Windows-${VERSION}.zip" * && cd ../..
          done

          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: BTN Launcher ${{ inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/*
