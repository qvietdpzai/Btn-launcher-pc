name: Build and Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag name
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_NAME: BTN-Launcher-Windows-MSVC-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure
        run: cmake --preset "$CMAKE_PRESET"

      - name: Build
        run: cmake --build --preset "$CMAKE_PRESET" --config Release

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: Release
          artifact-name: Windows-MSVC
          azure-client-id: ""
          azure-tenant-id: ""
          azure-subscription-id: ""

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_NAME: BTN-Launcher-Linux-x86_64-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Linux
          qt-version: 6.10.2

      - name: Configure
        run: cmake --preset "$CMAKE_PRESET"

      - name: Build
        run: cmake --build --preset "$CMAKE_PRESET" --config Release

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: Release
          artifact-name: Linux
          qt-version: 6.10.2

  create_release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: BTN Launcher ${{ inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.zsync
            artifacts/**/*.tar.gz
