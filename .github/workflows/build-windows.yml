name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-2022

    env:
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      ARTIFACT_NAME: BTN-Launcher-Windows-MSVC
      BUILD_PLATFORM: official

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.1.*"
          version: "6.7.3"
          modules: qtimageformats qtnetworkauth
          cache: true

      - name: Configure project
        run: |
          cmake --preset windows_msvc

      - name: Build
        run: |
          cmake --build --preset windows_msvc --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: |
          ctest --preset windows_msvc --build-config ${{ env.BUILD_TYPE }}

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config ${{ env.BUILD_TYPE }}

      - name: Create portable package
        shell: pwsh
        run: |
          if (Test-Path install-portable) { Remove-Item -Recurse -Force install-portable }
          Copy-Item -Recurse install install-portable
          cmake --install build --config ${{ env.BUILD_TYPE }} --prefix install-portable --component portable

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: BTN-Launcher-Windows-${{ env.BUILD_TYPE }}
          path: install/**/*
          retention-days: 30

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: BTN-Launcher-Windows-Portable-${{ env.BUILD_TYPE }}
          path: install-portable/**/*
          retention-days: 30
