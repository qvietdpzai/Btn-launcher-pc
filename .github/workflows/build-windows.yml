name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions: {}

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-2022

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: BTN-Launcher-Windows-MSVC-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: windows_msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve package version
        id: package-version
        shell: bash
        run: |
          echo "version=${{ steps.short-version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.package-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: Windows-MSVC
          azure-client-id: ""
          azure-tenant-id: ""
          azure-subscription-id: ""
